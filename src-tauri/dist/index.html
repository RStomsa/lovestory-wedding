<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoveStory Studio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #09090b;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    .card {
      background: rgba(24, 24, 27, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 32px 48px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(12px);
    }
    .ring {
      width: 54px;
      height: 54px;
      border: 4px solid #27272a;
      border-top-color: #ec4899;
      border-right-color: #a855f7;
      border-radius: 50%;
      animation: spin 0.9s cubic-bezier(0.5, 0.1, 0.4, 0.9) infinite;
      margin: 0 auto 20px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 8px; color: #fff; }
    p { font-size: 13px; color: #a1a1aa; line-height: 1.5; }
    .status {
      display: inline-block;
      margin-top: 16px;
      padding: 4px 12px;
      background: rgba(236, 72, 153, 0.15);
      color: #f472b6;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
  </style>
  <script>
    const targetUrl = "http://localhost:3000/admin/studio";
    function checkAndRedirect() {
      fetch(targetUrl, { mode: 'no-cors' })
        .then(() => {
          window.location.replace(targetUrl);
        })
        .catch(() => {
          setTimeout(checkAndRedirect, 800);
        });
    }
    setTimeout(checkAndRedirect, 300);
  </script>
</head>
<body>
  <div class="card">
    <div class="ring"></div>
    <h1>LoveStory Studio</h1>
    <p>Đang kết nối không gian thiết kế thiệp cưới chuyên nghiệp...</p>
    <div class="status">⚡ REALTIME STUDIO DESKTOP</div>
  </div>
</body>
</html>
